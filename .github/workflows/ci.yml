name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev gnupg \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxdamage-dev libxcomposite-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libdrm-dev libva-dev \
            libv4l-dev libglib2.0-dev libasound2-dev libpulse-dev libssl-dev libdbus-1-dev

      # Ubuntu 24 ships clang 18. webrtc-sys needs clang 21, via CC and CXX.
      - name: Clang 21 for WebRTC
        if: runner.os == 'Linux'
        run: scripts/install-clang.sh --install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Version
        if: runner.os != 'Windows'
        run: ./target/release/livekit-workbench --version
