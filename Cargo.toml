[package]
name = "livekit-workbench"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Workbench for LiveKit: a desktop app to explore LiveKit codecs, encoders, layers, bitrate and telemetry."
license = "MIT-0"
repository = "https://github.com/czoli1976/livekit-workbench"
authors = ["czoli1976"]
publish = false

[[bin]]
name = "livekit-workbench"
path = "src/main.rs"

[dependencies]
# The LiveKit SDK version is chosen at build time: scripts/build.* run
# `cargo update -p livekit` to the newest release, or pin it with --sdk-version.
livekit = { version = "0.11", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.10", features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
eframe = "0.37"
egui = "0.37"
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
keyring = "4"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
sha2 = "0.10.9"
semver = "1.0.28"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
turn = { version = "0.17", default-features = false }
webrtc-util = { version = "0.17", default-features = false, features = ["conn"] }
async-trait = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { git = "https://github.com/l1npengtul/nokhwa", rev = "4923ecab7cf26f9dba83867a15a9d8662d021296", default-features = false, features = ["input-avfoundation", "output-threaded"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Screen capture on Wayland talks to the desktop portal over a GLib main loop.
livekit = { version = "0.11", features = ["rustls-tls-native-roots", "glib-main-loop"] }
nokhwa = { git = "https://github.com/l1npengtul/nokhwa", rev = "4923ecab7cf26f9dba83867a15a9d8662d021296", default-features = false, features = ["input-v4l", "output-threaded"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { git = "https://github.com/l1npengtul/nokhwa", rev = "4923ecab7cf26f9dba83867a15a9d8662d021296", default-features = false, features = ["input-msmf", "output-threaded"] }

[build-dependencies]
toml = "0.9"

[profile.release]
opt-level = 3
debug = 1
